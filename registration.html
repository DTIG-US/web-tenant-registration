<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenant Registration – Insightful Health AI</title>
    <style>
        /* ─── Reset ────────────────────────────────────────────── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ─── Page Shell ───────────────────────────────────────── */
        body {
            font-family: 'Inter', Helvetica, sans-serif;
            background-color: #0a0f2c;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(125, 249, 255, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(0, 200, 212, 0.05) 0%, transparent 55%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        /* ─── Glassmorphism Card ───────────────────────────────── */
        .container {
            background: rgba(10, 15, 44, 0.65);
            backdrop-filter: blur(18px) saturate(1.4);
            -webkit-backdrop-filter: blur(18px) saturate(1.4);
            border: 1px solid rgba(125, 249, 255, 0.15);
            border-radius: 14px;
            box-shadow:
                0 0 60px rgba(125, 249, 255, 0.07),
                0 20px 60px rgba(0, 0, 0, 0.5);
            padding: 48px 40px 44px;
            max-width: 480px;
            width: 100%;
        }

        /* ─── Cyan accent bar at top ───────────────────────────── */
        .container::before {
            content: '';
            display: block;
            height: 2px;
            border-radius: 2px;
            background: linear-gradient(90deg, #7df9ff, #00c8d4);
            margin-bottom: 32px;
        }

        /* ─── Heading ──────────────────────────────────────────── */
        h1 {
            font-family: 'Outfit', 'Inter', Helvetica, sans-serif;
            color: #ffffff;
            font-size: 1.85rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            margin-bottom: 6px;
            text-align: center;
            text-shadow: 0 2px 16px rgba(0, 0, 0, 0.4);
        }

        .subtitle {
            font-family: 'Inter', Helvetica, sans-serif;
            color: rgba(200, 220, 255, 0.65);
            text-align: center;
            margin-bottom: 36px;
            font-size: 0.875rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        /* ─── Form Groups ──────────────────────────────────────── */
        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: rgba(200, 220, 255, 0.85);
            font-weight: 600;
            font-size: 0.78rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        /* ─── Inputs ───────────────────────────────────────────── */
        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid rgba(125, 249, 255, 0.2);
            border-radius: 7px;
            font-family: 'Inter', Helvetica, sans-serif;
            font-size: 0.9rem;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.04);
            transition: border-color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
        }

        input[type="text"]::placeholder,
        input[type="email"]::placeholder,
        input[type="password"]::placeholder {
            color: rgba(200, 220, 255, 0.3);
        }

        input:focus {
            outline: none;
            border-color: #7df9ff;
            background: rgba(125, 249, 255, 0.06);
            box-shadow: 0 0 0 3px rgba(125, 249, 255, 0.12);
        }

        /* ─── Tenant ID Row ────────────────────────────────────── */
        .tenant-id-container {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        #tenantId {
            flex: 1;
            background: rgba(10, 15, 44, 0.5);
            font-family: 'Courier New', monospace;
            font-weight: 700;
            letter-spacing: 3px;
            color: #7df9ff;
            cursor: default;
        }

        #tenantId:focus {
            border-color: rgba(125, 249, 255, 0.2);
            box-shadow: none;
        }

        /* ─── Generate Button ──────────────────────────────────── */
        .btn-generate {
            padding: 12px 18px;
            background: rgba(125, 249, 255, 0.1);
            color: #7df9ff;
            border: 1px solid rgba(125, 249, 255, 0.3);
            border-radius: 7px;
            font-family: 'Inter', Helvetica, sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.25s ease, box-shadow 0.25s ease, transform 0.2s ease;
            white-space: nowrap;
        }

        .btn-generate:hover {
            background: rgba(125, 249, 255, 0.18);
            box-shadow: 0 0 16px rgba(125, 249, 255, 0.25);
        }

        .btn-generate:active {
            transform: scale(0.97);
        }

        .btn-generate:focus-visible {
            outline: 2px solid #7df9ff;
            outline-offset: 3px;
        }

        /* ─── Submit Button ────────────────────────────────────── */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #7df9ff 0%, #00c8d4 100%);
            color: #0a0f2c;
            border: none;
            border-radius: 7px;
            font-family: 'Inter', Helvetica, sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow:
                0 0 20px rgba(125, 249, 255, 0.35),
                0 4px 14px rgba(0, 0, 0, 0.3);
            transition: box-shadow 0.25s ease, transform 0.2s ease, background 0.25s ease;
            margin-top: 12px;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #a0fbff 0%, #00e0ee 100%);
            box-shadow:
                0 0 32px rgba(125, 249, 255, 0.6),
                0 6px 20px rgba(0, 0, 0, 0.35);
            transform: translateY(-2px);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-submit:focus-visible {
            outline: 2px solid #7df9ff;
            outline-offset: 3px;
        }

        /* ─── Error Messages ───────────────────────────────────── */
        .error-message {
            color: #ff6b7a;
            font-size: 0.78rem;
            margin-top: 5px;
            display: none;
            font-weight: 500;
        }

        .error-message.show {
            display: block;
        }

        /* ─── Success Banner ───────────────────────────────────── */
        .success-message {
            background: rgba(125, 249, 255, 0.08);
            border: 1px solid rgba(125, 249, 255, 0.3);
            color: #7df9ff;
            padding: 14px 16px;
            border-radius: 8px;
            margin-top: 22px;
            display: none;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .success-message.show {
            display: block;
        }

        /* ─── Token Display ────────────────────────────────────── */
        .token-display {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(125, 249, 255, 0.12);
            border-radius: 8px;
            padding: 14px;
            margin-top: 16px;
            max-height: 200px;
            overflow-y: auto;
            display: none;
            font-size: 0.75rem;
            word-break: break-all;
            color: rgba(200, 220, 255, 0.75);
        }

        .token-display.show {
            display: block;
        }

        .token-display pre {
            margin: 0;
            white-space: pre-wrap;
        }

        .token-display strong {
            color: #7df9ff;
            display: block;
            margin-bottom: 8px;
            font-size: 0.78rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        /* ─── Loading Indicator ────────────────────────────────── */
        .loading {
            display: none;
            text-align: center;
            margin: 12px 0;
            color: #7df9ff;
            font-size: 0.875rem;
            font-weight: 600;
            letter-spacing: 0.04em;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(125, 249, 255, 0.2);
            border-top-color: #7df9ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ─── Divider between form and messages ────────────────── */
        .form-divider {
            border: none;
            border-top: 1px solid rgba(125, 249, 255, 0.1);
            margin: 8px 0 0;
        }

        /* ─── Responsive ───────────────────────────────────────── */
        @media (max-width: 540px) {
            .container {
                padding: 36px 24px 32px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .tenant-id-container {
                flex-direction: column;
                align-items: stretch;
            }

            .btn-generate {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="container" role="main">
        <h1>Create Account</h1>
        <p class="subtitle">Register your organization with EntraID</p>

        <form id="signupForm" novalidate aria-label="Organization registration form">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Jane Doe" autocomplete="name" required aria-required="true">
                <div class="error-message" id="nameError" role="alert" aria-live="polite">Please enter your full name</div>
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" id="address" name="address" placeholder="123 Main St, City, State, ZIP" autocomplete="street-address" required aria-required="true">
                <div class="error-message" id="addressError" role="alert" aria-live="polite">Please enter your address</div>
            </div>

            <div class="form-group">
                <label for="company">Company</label>
                <input type="text" id="company" name="company" placeholder="Company Name" autocomplete="organization" required aria-required="true">
                <div class="error-message" id="companyError" role="alert" aria-live="polite">Please enter your company name</div>
            </div>

            <div class="form-group">
                <label for="tenantId">Tenant ID (6-digit hash)</label>
                <div class="tenant-id-container">
                    <input type="text" id="tenantId" name="tenantId" readonly required aria-required="true" aria-describedby="tenantError">
                    <button type="button" class="btn-generate" id="generateTenantBtn" aria-label="Generate new Tenant ID">Generate</button>
                </div>
                <div class="error-message" id="tenantError" role="alert" aria-live="polite">Please generate a Tenant ID</div>
            </div>

            <!-- Hidden fields for EntraID token -->
            <input type="hidden" id="idToken" name="idToken">
            <input type="hidden" id="accessToken" name="accessToken">

            <button type="submit" class="btn-submit" id="submitBtn">Register with EntraID</button>
        </form>

        <div class="loading" id="loadingIndicator" role="status" aria-live="polite">
            <span class="spinner" aria-hidden="true"></span> Authenticating with EntraID…
        </div>

        <div class="success-message" id="successMessage" role="status" aria-live="polite">
            ✅ Registration successful! JWT token issued by EntraID.
        </div>

        <div class="token-display" id="tokenDisplay" aria-label="JWT Token">
            <strong>JWT Token</strong>
            <pre id="tokenContent"></pre>
        </div>
    </div>

    <script>
        // ============================================================
        // 1. GENERATE RANDOM 6-DIGIT TENANT ID
        // ============================================================
        function generateTenantId() {
            const min = 100000;
            const max = 999999;
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function formatTenantId(id) {
            return id.toString().padStart(6, '0');
        }

        function updateTenantId() {
            const tenantIdInput = document.getElementById('tenantId');
            tenantIdInput.value = formatTenantId(generateTenantId());
            const errorEl = document.getElementById('tenantError');
            errorEl.classList.remove('show');
            tenantIdInput.style.borderColor = '';
        }

        // ============================================================
        // 2. MOCK ENTRAID TOKEN ISSUANCE (Replace with real EntraID MSAL)
        // ============================================================
        function mockEntraIdToken(userData) {
            const header = { alg: "RS256", typ: "JWT", kid: "mock-key-id" };

            const payload = {
                sub: "user-" + Math.random().toString(36).substring(2, 10),
                name: userData.name,
                email: userData.email || userData.name + "@example.com",
                iss: "https://login.microsoftonline.com/your-tenant-id/v2.0",
                aud: "your-client-id",
                exp: Math.floor(Date.now() / 1000) + 3600,
                iat: Math.floor(Date.now() / 1000),
                nbf: Math.floor(Date.now() / 1000),
                tenantId: userData.tenantId,
                company: userData.company,
                address: userData.address,
                tenantHash: userData.tenantId
            };

            const base64UrlEncode = (obj) =>
                btoa(JSON.stringify(obj))
                    .replace(/\+/g, '-')
                    .replace(/\//g, '_')
                    .replace(/=+$/, '');

            const mockSignature = btoa("mock-signature-" + Math.random().toString(36).substring(2, 15))
                .replace(/\+/g, '-')
                .replace(/\//g, '_')
                .replace(/=+$/, '');

            return {
                token: base64UrlEncode(header) + '.' + base64UrlEncode(payload) + '.' + mockSignature,
                decodedPayload: payload
            };
        }

        // ============================================================
        // 3. FORM SUBMISSION HANDLER
        // ============================================================
        document.getElementById('signupForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            document.getElementById('successMessage').classList.remove('show');
            document.getElementById('tokenDisplay').classList.remove('show');
            document.querySelectorAll('.error-message').forEach(el => el.classList.remove('show'));

            const name     = document.getElementById('name').value.trim();
            const address  = document.getElementById('address').value.trim();
            const company  = document.getElementById('company').value.trim();
            const tenantId = document.getElementById('tenantId').value.trim();

            let isValid = true;

            function setError(inputId, errorId, valid) {
                const el = document.getElementById(inputId);
                const err = document.getElementById(errorId);
                if (!valid) {
                    err.classList.add('show');
                    el.style.borderColor = '#ff6b7a';
                    isValid = false;
                } else {
                    el.style.borderColor = '';
                }
            }

            setError('name', 'nameError', !!name);
            setError('address', 'addressError', !!address);
            setError('company', 'companyError', !!company);
            setError('tenantId', 'tenantError', !!(tenantId && tenantId.length === 6));

            if (!isValid) return;

            const submitBtn = document.getElementById('submitBtn');
            const loadingIndicator = document.getElementById('loadingIndicator');
            submitBtn.disabled = true;
            loadingIndicator.classList.add('show');

            try {
                const userData = { name, address, company, tenantId };
                console.log('Requesting token from EntraID for:', userData);

                await new Promise(resolve => setTimeout(resolve, 1500));

                const result = mockEntraIdToken(userData);
                console.log('Token received from EntraID:', result.token);
                console.log('Decoded payload with tenantId claim:', result.decodedPayload);

                document.getElementById('idToken').value = result.token;
                document.getElementById('accessToken').value = result.token;
                document.getElementById('successMessage').classList.add('show');
                document.getElementById('tokenContent').textContent = result.token;
                document.getElementById('tokenDisplay').classList.add('show');
                console.log('✅ Tenant ID claim value:', result.decodedPayload.tenantId);
            } catch (error) {
                console.error('Error during token issuance:', error);
                alert('Failed to issue token from EntraID. Please try again.');
            } finally {
                loadingIndicator.classList.remove('show');
                submitBtn.disabled = false;
            }
        });

        // ============================================================
        // 4. GENERATE TENANT ID ON LOAD AND BUTTON CLICK
        // ============================================================
        document.getElementById('generateTenantBtn').addEventListener('click', updateTenantId);
        document.addEventListener('DOMContentLoaded', updateTenantId);

        // ============================================================
        // 5. VALIDATE TENANT ID FORMAT ON CHANGE
        // ============================================================
        document.getElementById('tenantId').addEventListener('change', function () {
            const val = this.value.trim();
            if (val && !/^\d{6}$/.test(val)) {
                this.style.borderColor = '#ff6b7a';
                document.getElementById('tenantError').textContent = 'Tenant ID must be exactly 6 digits';
                document.getElementById('tenantError').classList.add('show');
            } else {
                this.style.borderColor = '';
                document.getElementById('tenantError').classList.remove('show');
            }
        });

        console.log('%c📋 Insightful Health AI – Tenant Registration Loaded', 'font-size: 15px; font-weight: bold;');
        console.log('%cTenant ID will be included as a custom claim in the JWT', 'color: #7df9ff;');
    </script>
</body>

</html>
